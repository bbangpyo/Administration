<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행 총무">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f4f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>여행 총무</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--soft:#efefec;--line:rgba(0,0,0,.09);--line2:rgba(0,0,0,.2);--tx:#1d1d1b;--tx2:#6b6b66;--tx3:#9b9b95;--ac:#2563d9;--acbg:#e8f0fd;--acln:#b9cff6;--ok:#1f9d55;--okbg:#e6f6ec;--bad:#d93b3b;--badbg:#fdecec;--badln:#f3b9b9;--warn:#9a6200;--warnbg:#fdf3dc}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1d1d1d;--soft:#2a2a2a;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.22);--tx:#efefef;--tx2:#a8a8a2;--tx3:#77776f;--ac:#6ea0ff;--acbg:#1c2b47;--acln:#34507f;--ok:#4cc47f;--okbg:#17321f;--bad:#ff7474;--badbg:#3a1c1c;--badln:#6b2c2c;--warn:#f0c060;--warnbg:#3a2e12}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:17px;line-height:1.45}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 96px)}
button{font:inherit;color:inherit;background:var(--card);border:0.5px solid var(--line2);border-radius:10px;padding:8px 14px;cursor:pointer}
button.pri{background:var(--tx);color:var(--bg);border:none;font-weight:600;width:100%;padding:13px;margin-top:22px;font-size:18px}
button.danger{background:var(--bad);color:#fff;border:none}
button.ghostdanger{color:var(--bad);border-color:var(--badln);width:100%;margin-top:10px;padding:12px}
p{margin:0}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;min-height:34px}
.hdr .ttl{display:flex;align-items:center;gap:4px;min-width:0}
.hdr .acts{display:flex;gap:8px}
.h1{font-size:25px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h2{font-size:20px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:32px;height:32px;min-width:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--tx2)}
.bare{border:none;background:none;padding:4px;color:var(--tx2);display:inline-flex;align-items:center}
.textbtn{border:none;background:none;color:var(--ac);font-weight:600;padding:6px 8px}
.banner{background:var(--soft);color:var(--tx2);font-size:14px;border-radius:10px;padding:8px 10px;margin-bottom:12px}
.banner.act{cursor:pointer}
.empty{color:var(--tx2);font-size:16px;text-align:center;padding:28px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:10px;padding:3px;margin:0 0 12px}
.seg button{border:none;background:none;padding:8px 0;border-radius:8px;color:var(--tx2);font-size:16px}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .cnt{font-size:14px;color:var(--tx3);margin-left:3px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:146px;gap:10px}
.grid.ed{gap:14px;padding:6px 6px 0 0}
.tcard{position:relative;background:var(--card);border:0.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;min-width:0;cursor:pointer}
.tcard.live{box-shadow:inset 0 0 0 1.5px var(--ok)}
.tcard .tn,.tcard .ts,.tcard .ta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .tn{font-size:18px;font-weight:700;margin-top:10px}
.tcard .ts{font-size:14px;color:var(--tx2);margin-top:1px;min-height:17px}
.tcard .ta{font-size:16px;font-weight:600;margin-top:auto}
.ctag{font-size:11px;padding:1px 5px;border-radius:5px;background:var(--acbg);color:var(--ac);margin-left:4px;vertical-align:1px}
.addcard{background:none;border:1px dashed var(--line2);align-items:center;justify-content:center;color:var(--tx2);font-size:16px;gap:4px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 8px;border-radius:8px;align-self:flex-start;background:var(--soft);color:var(--tx2);white-space:nowrap;max-width:100%;cursor:pointer}
.st .ell{overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.d0{background:var(--ok)}.d1{background:var(--bad)}.d2{background:var(--ac)}
.smenu{position:absolute;top:42px;left:8px;right:8px;z-index:5;background:var(--card);border:0.5px solid var(--line2);border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.14);cursor:default}
.sopt{display:flex;align-items:center;gap:8px;padding:9px 10px;font-size:15px;border-top:0.5px solid var(--line);cursor:pointer}
.sopt:first-child{border-top:none}
.sopt.on{font-weight:600}
.sopt svg{color:var(--ac)}
.xb{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;display:flex;align-items:center;justify-content:center;border:none;padding:0;z-index:2}
.chip .xb{width:16px;height:16px}
.pb{position:absolute;top:-6px;left:-6px;width:16px;height:16px;border-radius:50%;background:var(--card);border:0.5px solid var(--line2);color:var(--tx3);display:flex;align-items:center;justify-content:center;padding:0;z-index:2}
.pb.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pb.lock{cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:6px}
.chips.ed{gap:14px 20px;padding:10px 6px 0}
.chips.edx{gap:14px;padding:10px 6px 0 0}
.chip{position:relative;display:inline-flex;align-items:center;gap:4px;padding:7px 13px;border-radius:18px;border:0.5px solid var(--line2);font-size:16px;color:var(--tx2);background:var(--card);cursor:pointer;user-select:none;-webkit-user-select:none}
.chip.on{background:var(--acbg);border-color:var(--acln);color:var(--ac);font-weight:600}
.chip.add{border-style:dashed}
.chip.locked{color:var(--tx3);cursor:default}
.chip .code{font-size:11px;opacity:.75}
.chip svg.pinmark{color:var(--ac)}
.lb{font-size:15px;color:var(--tx2);margin:18px 0 6px}
.lbrow{display:flex;justify-content:space-between;align-items:center;margin:18px 0 0}
.lbrow .lb{margin:0}
.inp{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:0.5px solid var(--line2);border-radius:10px;background:var(--card);color:var(--tx);-webkit-appearance:none;appearance:none;min-height:44px}
.inp:focus{outline:2px solid var(--acln);outline-offset:0}
.inp.sm{width:92px;flex:none}
select.inp{background-image:none}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.raterow{display:flex;gap:8px;align-items:center;font-size:17px}
.raterow .inp{min-width:0}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:1.5px solid var(--line2);padding-bottom:4px}
.amt input{border:none;background:none;font:inherit;font-size:32px;font-weight:700;width:100%;padding:2px 0;color:var(--tx);outline:none;min-width:0}
.amt span{font-size:18px;color:var(--tx2);white-space:nowrap}
.hint{font-size:14px;color:var(--tx3);margin-top:8px}
.err{color:var(--bad);font-size:15px;margin-top:8px}
.inline{display:flex;gap:6px;margin-top:12px}
.inline .inp{flex:1;min-width:0}
.ckline{display:flex;align-items:center;gap:8px;font-size:16px;margin-top:10px}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--ac);margin:0;flex:none}
.confirm{background:var(--badbg);color:var(--bad);border-radius:10px;padding:12px;font-size:16px;margin:10px 0}
.confirm small{font-size:14px;display:block;margin-top:2px}
.confirm .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:12px;font-size:15px;margin-top:10px}
.warnbox p+p{margin-top:4px}
.fxbox{background:var(--soft);border-radius:12px;padding:2px 12px 14px;margin-top:10px}
.fxbox .lb,.fxbox .lbrow{margin-top:12px}
.newbox{background:var(--card);border:0.5px solid var(--line2);border-radius:10px;padding:10px 12px;margin-top:12px}
.newbox .lb{margin:10px 0 4px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.fx{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 14px;margin:0 0 10px}
.fx label{display:inline-flex;align-items:center;gap:6px;font-size:16px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.box{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:12px 5px;text-align:center;min-width:0}
.box .l{font-size:14px;color:var(--tx2)}
.box .v{font-size:19px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .p{font-size:14px;color:var(--tx2);margin-top:6px;padding-top:6px;border-top:0.5px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box.rem{background:var(--acbg);border-color:var(--acln)}
.box.rem .l,.box.rem .v,.box.rem .p{color:var(--ac)}
.box.rem .p{border-top-color:var(--acln)}
.sect{font-size:16px;color:var(--tx2);margin:22px 0 8px;display:flex;justify-content:space-between;align-items:center}
.list{background:var(--card);border:0.5px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border-top:0.5px solid var(--line);cursor:pointer}
.it:first-child{border-top:none}
.it .m{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .v{white-space:nowrap}
.subl{display:block;font-size:13px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legbox{background:var(--card);border:0.5px solid var(--line2);border-radius:12px;padding:10px 12px;margin-top:10px}
.legbox .lh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:16px}
.legbox .lh .inp{width:auto;min-height:38px;padding:6px 8px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.route .ap{width:84px;min-height:40px;padding:6px 8px;text-align:center}
.route .ap.stop{border-style:dashed}
.route .arr{color:var(--tx3)}
.route .sw{position:relative;display:inline-flex}
.legfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.addstop{border:0.5px dashed var(--line2);background:none;border-radius:16px;padding:5px 12px;font-size:14px;color:var(--tx2)}
.tag{font-size:13px;color:var(--tx2);margin-right:5px}
.t{width:100%;table-layout:fixed;border-collapse:collapse;font-size:16px;background:var(--card);border-radius:12px;overflow:hidden;border:0.5px solid var(--line)}
.t td,.t th{padding:9px 10px;border-bottom:0.5px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t tr:last-child td{border-bottom:none}
.t th{font-size:14px;font-weight:600;color:var(--tx2);text-align:right}
.t th:first-child{text-align:left}
.t .g td{background:var(--soft);font-weight:600}
.t .tot td{background:var(--soft);font-weight:700}
.t .x td{color:var(--tx3);text-decoration:line-through}
.t tr.row{cursor:pointer}
.t.sm{font-size:14px}
.t.sm td,.t.sm th{padding:8px 5px}
.r{text-align:right}
.acc{color:var(--ac)}
.note{font-size:14px;color:var(--tx3);margin-top:8px}
.sec{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.sech{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.sech .n{font-size:16px;font-weight:600}
.sech .s{font-weight:400;font-size:14px;color:var(--tx2);margin-left:4px}
.mr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:0.5px solid var(--line);font-size:16px;gap:8px}
.mr label{display:flex;align-items:center;gap:10px;min-width:0}
.okc{color:var(--ok)}.badc{color:var(--bad)}.partc{color:var(--warn)}
.paybtn{border:none;background:none;padding:4px 0;font-size:15px;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.payed{display:flex;align-items:center;gap:4px;font-size:15px}
.payed .inp{width:110px;min-height:34px;padding:6px 8px;font-size:17px;text-align:right}
.payed button{padding:6px 10px;font-size:15px}
.stat{border-radius:12px;padding:12px;margin-top:8px}
.stat.bad{background:var(--badbg);color:var(--bad)}
.stat.ok{background:var(--okbg);color:var(--ok);text-align:center}
.stat .hl{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:17px}
.stat .ln{display:flex;justify-content:space-between;font-size:15px;margin-top:6px;gap:8px}
.paidbox{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:baseline}
.wide{width:100%;margin-top:12px;padding:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.tgrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px}
.tgrow .rt{font-size:14px;color:var(--tx3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{position:relative;display:inline-flex;flex:none;height:44px;padding:3px;background:var(--soft);border-radius:22px;cursor:pointer;user-select:none;-webkit-user-select:none}
.tg .knob{position:absolute;top:3px;left:3px;width:70px;height:38px;background:var(--card);border-radius:19px;box-shadow:0 1px 3px rgba(0,0,0,.14);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.tg.isf .knob{transform:translateX(70px)}
.tg .lab{position:relative;z-index:1;width:70px;height:38px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:var(--tx3);transition:color .28s}
.tg:not(.isf) .l0,.tg.isf .l1{color:var(--tx)}
.tg:focus-visible{outline:2px solid var(--acln);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.tg .knob,.tg .lab{transition:none}}
.ratebox{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ratebox .lbl{font-size:15px;color:var(--tx2)}
.ratebox b{font-weight:600}
.calcin{background:var(--card);border:0.5px solid var(--line2);border-radius:14px;padding:12px 14px;margin-top:12px}
.calcin .l{font-size:14px;color:var(--tx2)}
.calcin .row{display:flex;align-items:baseline;gap:6px}
.calcin input{flex:1;min-width:0;border:none;background:none;font:inherit;font-size:30px;font-weight:700;color:var(--tx);padding:2px 0;outline:none}
.calcin .u{color:var(--tx2)}
.swap{display:flex;justify-content:center;margin:-10px 0;position:relative;z-index:1}
.swap button{width:38px;height:38px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center}
.calcout{background:var(--acbg);border-radius:14px;padding:12px 14px;color:var(--ac)}
.calcout .l{font-size:14px}
.calcout .v{font-size:30px;font-weight:700;margin-top:2px;word-break:break-all}
.calcout .v span{font-size:17px;font-weight:500}
.qks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.qk{padding:7px 12px;border-radius:16px;border:0.5px solid var(--line2);font-size:15px;color:var(--tx2);background:var(--card);cursor:pointer}
.panel{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.panel .btns{display:flex;gap:8px;margin-top:10px}
.panel .btns>*{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border:0.5px solid var(--line2);border-radius:10px;font-size:16px;cursor:pointer;background:var(--card)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;background:var(--card);border-top:0.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nav button{border:none;background:none;border-radius:0;padding:8px 0 9px;font-size:13px;color:var(--tx3);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.on{color:var(--ac)}
.fab{position:fixed;z-index:11;right:max(16px,calc(50% - 224px));bottom:calc(env(safe-area-inset-bottom) + 72px);border-radius:26px;background:var(--ac);color:#fff;border:none;padding:12px 18px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;align-items:center;gap:6px}
.ver{text-align:center;font-size:13px;color:var(--tx3);margin-top:28px}
.sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:40;pointer-events:none}
html,body{touch-action:manipulation;overscroll-behavior-y:none}
.loading{color:var(--tx2);text-align:center;padding:40px 0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="sbar" aria-hidden="true"></div>
<div id="app"><p class="loading">불러오는 중…</p></div>
<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Math.round(n||0).toLocaleString('ko-KR');
const nf=(n,d)=>Number(n||0).toLocaleString('ko-KR',{maximumFractionDigits:d});
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const D=s=>{const p=String(s||'').split('-').map(Number);return Date.UTC(p[0],(p[1]||1)-1,p[2]||1);};
const DAY=86400000;
const md=s=>{const p=String(s||'').split('-');return p.length===3?p[1]+'.'+p[2]:'';};
const ymd=s=>{const p=String(s||'').split('-');return p.length===3?p[0].slice(2)+'.'+p[1]+'.'+p[2]:'';};
const digits=s=>Number(String(s||'').replace(/[^0-9]/g,''))||0;
const decNum=s=>{const v=String(s==null?'':s).replace(/,/g,'').trim();if(!v)return NaN;return Number(v);};
const sv=(p,w,sw)=>'<svg width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';

/* ---------- constants ---------- */
const DEF_CUR=[{k:'JPY',n:'엔화',u:'엔',b:100,lock:1},{k:'USD',n:'달러',u:'달러',b:1,lock:1},{k:'EUR',n:'유로',u:'유로',b:1},{k:'CNY',n:'위안',u:'위안',b:1},{k:'TWD',n:'대만 달러',u:'대만 달러',b:1},{k:'THB',n:'바트',u:'바트',b:1},{k:'VND',n:'동',u:'동',b:100},{k:'PHP',n:'페소',u:'페소',b:1}];
const QK={JPY:[1000,5000,10000,50000],USD:[10,50,100,500],EUR:[10,50,100,500],CNY:[50,100,500,1000],TWD:[100,500,1000,2000],THB:[100,500,1000,2000],VND:[50000,100000,500000,1000000],PHP:[100,500,1000,2000]};
const SN=['여행 중','출발 전','여행 완료'];
const KIND={dom:'🚗 국내',abroad:'✈️ 해외'};
const defaultCats=()=>[{n:'식비'},{n:'놀거리'},{n:'교통'},{n:'숙소',fx:1,lock:1},{n:'항공',fx:1,lock:1},{n:'기타',lock:1,nofx:1}];
const fxLabel=n=>n==='숙소'?'숙박비':n==='항공'?'항공권':n;

/* ---------- state ---------- */
const S={profile:{members:[],currencies:clone(DEF_CUR),lastBackup:null},trips:{}};
const ui={view:'list',listTab:'dom',tripId:null,tab:'home',sub:'list',listEdit:false,delTrip:null,statusOpen:null,
  draft:null,expId:null,catEdit:false,catAdding:false,catAsk:null,delExp:false,
  tdraft:null,rdraft:null,memEdit:false,memAdding:false,curEdit:false,curAdding:false,curAsk:null,
  roundAdding:false,delRound:null,payEdit:null,rateEdit:false,calc:{dir:0,val:''},
  backupOpen:false,restore:null,err:'',banner:'',loading:true,focus:null};
try{const lt=localStorage.getItem('tt-listTab');if(lt==='abroad')ui.listTab='abroad';}catch(e){}
let mode='loading',col=null,pendingRender=false;

function normProfile(p){p=p||{};p.members=Array.isArray(p.members)?p.members:[];
  p.currencies=Array.isArray(p.currencies)&&p.currencies.length?p.currencies:clone(DEF_CUR);
  p.currencies.forEach(c=>{if(c.k==='JPY'||c.k==='USD')c.lock=1;});
  if(!p.currencies.some(c=>c.k==='JPY'))p.currencies.unshift(clone(DEF_CUR[0]));
  if(!p.currencies.some(c=>c.k==='USD'))p.currencies.splice(1,0,clone(DEF_CUR[1]));
  p.lastBackup=p.lastBackup||null;return p;}
function norm(t){t=t||{};
  t.members=Array.isArray(t.members)?t.members:[];t.cats=Array.isArray(t.cats)&&t.cats.length?t.cats:defaultCats();
  t.exps=Array.isArray(t.exps)?t.exps:[];t.exps.forEach(e=>{if(e.cur!=='F')e.cur='K';});
  t.rounds=Array.isArray(t.rounds)?t.rounds:[];t.rounds.forEach(r=>{r.paid=r.paid&&typeof r.paid==='object'?r.paid:{};Object.keys(r.paid).forEach(k=>{const v=Number(r.paid[k]);if(v===1&&r.amt>1)r.paid[k]=r.amt;else if(!(v>0))delete r.paid[k];else r.paid[k]=Math.min(v,r.amt);});});
  t.refunded=t.refunded&&typeof t.refunded==='object'?t.refunded:{};t.inc=t.inc&&typeof t.inc==='object'?t.inc:{};
  if(!(t.status===0||t.status===1||t.status===2))t.status=null;
  t.kind=t.kind==='abroad'?'abroad':'dom';
  if(t.kind==='abroad'){if(!t.cur||!t.cur.k)t.cur=clone(DEF_CUR[0]);delete t.cur.lock;if(!t.rate||!(t.rate.b>0))t.rate={b:t.cur.b||1,w:null};}
  t.fview=!!t.fview;return t;}

/* ---------- storage ---------- */
const LKEY='trip-treasurer-v2';
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LKEY)||'null');if(v){S.profile=normProfile(v.profile);S.trips={};Object.keys(v.trips||{}).forEach(k=>S.trips[k]=norm(v.trips[k]));}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S));}catch(e){ui.banner='기기 저장 공간에 저장하지 못했어요. 저장 공간을 확인해 주세요.';}}
const writing=new Set(),dirty=new Map();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function errMsg(e){const c=e&&e.code;
  if(c==='quota_exceeded')return '저장 공간이 가득 찼어요. 지난 여행을 지운 뒤 다시 시도해 주세요.';
  if(c==='revoked'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed')return '저장 권한이 없어 변경 내용이 저장되지 않아요.';
  if(c==='invalid_argument')return '이 화면에서는 저장할 수 없어요. 내 계정으로 로그인했는지 확인해 주세요.';
  return '저장하지 못했어요. 인터넷 연결을 확인해 주세요.';}
async function persist(key,obj){
  if(mode==='local'){saveLocal();return;}
  if(mode!=='db')return;
  dirty.set(key,obj===null?null:clone(obj));
  if(writing.has(key))return;
  writing.add(key);
  while(dirty.has(key)){const v=dirty.get(key);dirty.delete(key);
    const ref=col.doc(key);const op=()=>v===null?ref.delete():ref.set(v);
    try{await op();}catch(e){
      if(e&&e.code==='unavailable'){await sleep(600+Math.random()*900);try{await op();}catch(e2){ui.banner=errMsg(e2);render();}}
      else{ui.banner=errMsg(e);render();}}}
  writing.delete(key);}
const saveTrip=t=>persist('trip-'+t.id,t);
const saveProfile=()=>persist('profile',S.profile);
function saveAll(oldIds){saveProfile();Object.values(S.trips).forEach(saveTrip);(oldIds||[]).forEach(id=>{if(!S.trips[id])persist('trip-'+id,null);});}

async function init(){
  let db=null,user=null,uid=null;
  try{if(window.claude&&typeof window.claude.use==='function'){const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);db=r[0];user=r[1];}}catch(e){}
  if(db&&user){try{uid=await user.id();}catch(e){}}
  if(!db||!uid){mode='local';loadLocal();ui.loading=false;
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
    render();return;}
  mode='db';
  try{col=db.collection('data/users/'+uid);}catch(e){mode='local';loadLocal();ui.loading=false;render();return;}
  const timer=setTimeout(()=>{if(ui.loading){ui.loading=false;ui.banner='저장된 데이터를 아직 불러오지 못했어요. 인터넷 연결을 확인해 주세요.';render();}},10000);
  col.onSnapshot(snap=>{
    let changed=ui.loading;
    if(!snap.metadata.fromCache){clearTimeout(timer);if(ui.banner.indexOf('불러오지 못했어요')>=0){ui.banner='';changed=true;}}
    ui.loading=false;const seen=new Set();
    snap.docs.forEach(d=>{
      if(writing.has(d.id)||dirty.has(d.id)){if(d.id.indexOf('trip-')===0)seen.add(d.id.slice(5));return;}
      const v=d.data();if(!v)return;
      if(d.id==='profile'){const nv=normProfile(clone(v));if(JSON.stringify(nv)!==JSON.stringify(S.profile)){S.profile=nv;changed=true;}}
      else if(d.id.indexOf('trip-')===0){const id=d.id.slice(5);seen.add(id);const nv=norm(clone(v));if(JSON.stringify(nv)!==JSON.stringify(S.trips[id])){S.trips[id]=nv;changed=true;}}});
    if(!snap.metadata.fromCache){Object.keys(S.trips).forEach(id=>{const k='trip-'+id;if(!seen.has(id)&&!writing.has(k)&&!dirty.has(k)){delete S.trips[id];changed=true;}});}
    if(changed)softRender();
  },e=>{clearTimeout(timer);ui.loading=false;ui.banner=errMsg(e);render();});
}

/* ---------- money ---------- */
const cur=()=>S.trips[ui.tripId];
const curList=()=>S.profile.currencies;
const curFind=k=>curList().find(c=>c.k===k);
function rateOf(t){return t&&t.kind==='abroad'&&t.rate&&t.rate.w>0&&t.rate.b>0?t.rate.w/t.rate.b:0;}
function krw(t,e){return e.cur==='F'?Math.round((e.famt||0)*rateOf(t)):(e.amt||0);}
function decOf(c){return c&&c.b>=100?0:2;}
function fnum(t,v){return nf(v,decOf(t.cur));}
function isF(t){return t.kind==='abroad'&&t.fview&&rateOf(t)>0;}
function mon(t,v,fixed){if(isF(t)&&!fixed)return fnum(t,v/rateOf(t))+esc(t.cur.u);return won(v)+'원';}
function rowMon(t,e,fixed){if(isF(t)&&!fixed&&e.cur==='F')return fnum(t,e.famt)+esc(t.cur.u);return mon(t,krw(t,e),fixed);}
function rateText(t){if(!rateOf(t))return '환율 미설정';return nf(t.rate.b,2)+t.cur.u+' = '+nf(t.rate.w,2)+'원';}
function hasF(t){return t.exps.some(e=>e.cur==='F');}
function toKRW(t,r){t.exps.forEach(e=>{if(e.cur==='F'){e.amt=Math.round((e.famt||0)*r);e.cur='K';delete e.famt;}});}

/* ---------- calculations ---------- */
const now=()=>D(todayStr());
function catOf(t,n){return t.cats.find(c=>c.n===n);}
function isFx(t,n){const c=catOf(t,n);return !!(c&&c.fx);}
function calc(t){
  const N=t.members.length,per=v=>N?v/N:0;
  let nonfx=0,allFixed=0;const fixedBy={};
  t.exps.forEach(e=>{const a=krw(t,e);if(isFx(t,e.cat)){fixedBy[e.cat]=(fixedBy[e.cat]||0)+a;allFixed+=a;}else nonfx+=a;});
  let inc=0;Object.keys(fixedBy).forEach(c=>{if(t.inc[c])inc+=fixedBy[c];});
  let paid=0,due=0;const unpaid={};
  t.rounds.forEach(r=>t.members.forEach(m=>{const pa=paidOf(r,m.id);due+=r.amt;paid+=pa;if(pa<r.amt)unpaid[m.id]=(unpaid[m.id]||0)+r.amt-pa;}));
  return {N,per,nonfx,allFixed,fixedBy,inc,paid,due,unpaid,collected:paid+inc,spent:nonfx+inc,remain:paid-nonfx,total:nonfx+allFixed};
}
function paidOf(r,mid){const v=Number(r.paid[mid])||0;return Math.min(v,r.amt);}
function fxSettle(t){
  /* 숙박비·항공권처럼 한 사람이 결제한 고정 지출의 정산 현황 */
  const N=t.members.length,list=[];
  t.exps.forEach(e=>{if(!isFx(t,e.cat)||!e.payer)return;const payer=t.members.find(m=>m.id===e.payer);if(!payer||!N)return;
    const per=Math.round(krw(t,e)/N),got=e.got||{};
    const rows=t.members.filter(m=>m.id!==e.payer).map(m=>{const g=Math.min(Number(got[m.id])||0,per);return {m,g,left:per-g};});
    list.push({e,payer,per,rows});});
  return list;}
function legText(g){return [g.from||'?'].concat((g.stops||[]).filter(Boolean)).concat([g.to||'?']).join(' → ');}
function expSub(t,e){
  if(e.cat==='숙소'&&e.ci&&e.co){const n=Math.round((D(e.co)-D(e.ci))/DAY);return md(e.ci)+' – '+md(e.co)+' · '+n+'박';}
  if(e.cat==='항공'&&e.fl){const f=e.fl,out=[];if(f.type!=='back')out.push('가는 편 '+md(f.out.date)+' · '+legText(f.out));if(f.type!=='out')out.push('오는 편 '+md(f.back.date)+' · '+legText(f.back));return out.join('\n');}
  return '';}
function autoSt(t,n){const s=D(t.start),e=D(t.end);return n<s?1:n<=e?0:2;}
function stOf(t,n){return t.status===null?autoSt(t,n):t.status;}
function counter(t,n){const s=D(t.start),e=D(t.end);if(n<s)return 'D-'+Math.round((s-n)/DAY);if(n<=e)return (Math.round((n-s)/DAY)+1)+'일차';return 'D+'+Math.round((n-e)/DAY);}
function stLabel(t,st,n){const a=autoSt(t,n),c=counter(t,n);if(st===a){if(st===1)return '출발 '+c;if(st===0)return '여행 중 · '+c;return '여행 완료';}return SN[st]+' · '+c;}
function dayLabel(t,d){const s=D(t.start),e=D(t.end),x=D(d);return md(d)+(x>=s&&x<=e?' · '+(Math.round((x-s)/DAY)+1)+'일차':'');}
function cardDates(t){if(!t.start)return '';return ymd(t.start)+(t.end&&t.end!==t.start?' – '+md(t.end):'');}

/* ---------- shared pieces ---------- */
function bannerH(){return ui.banner?'<p class="banner">'+esc(ui.banner)+'</p>':'';}
function pill(a,on,l0,l1,label){return '<div class="tg'+(on?' isf':'')+'" data-a="'+a+'" role="switch" tabindex="0" aria-checked="'+on+'" aria-label="'+esc(label)+'"><span class="knob"></span><span class="lab l0">'+l0+'</span><span class="lab l1">'+l1+'</span></div>';}

const app=document.getElementById('app');
function render(){
  pendingRender=false;const sy=window.scrollY;let h;

function fitText(){
  /* 금액이 칸보다 길면 잘리지 않도록 글자를 조금씩 줄여요 */
  const over=el=>{const cs=getComputedStyle(el);const avail=el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    const r=document.createRange();r.selectNodeContents(el);return r.getBoundingClientRect().width>avail-0.5;};
  app.querySelectorAll('.box .v,.box .p,.t td.r,.t th').forEach(el=>{
    if(!over(el))return;let fs=parseFloat(getComputedStyle(el).fontSize);
    while(over(el)&&fs>11){fs-=0.5;el.style.fontSize=fs+'px';}
  });

async function doBackup(){
  const stamp=new Date();const name='trip-treasurer-backup-'+stamp.getFullYear()+pad(stamp.getMonth()+1)+pad(stamp.getDate())+'.json';
  const data=JSON.stringify({app:'trip-treasurer',v:2,exported:stamp.toISOString(),profile:S.profile,trips:S.trips});
  ui.err='';
  try{
    const file=new File([data],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'여행 총무 백업'});}
    else{const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}
    S.profile.lastBackup=Date.now();saveProfile();ui.banner='백업 파일을 만들었어요. iCloud Drive에 저장했는지 확인해 주세요.';ui.backupOpen=false;render();
  }catch(e){if(e&&e.name==='AbortError')return;ui.err='이 화면에서는 백업 파일을 만들 수 없어요. 홈 화면에 추가한 앱에서 다시 시도해 주세요.';render();}
}

  const fr=new FileReader();
  fr.onload=()=>{try{const v=JSON.parse(fr.result);if(!v||v.app!=='trip-treasurer'||typeof v.trips!=='object')throw 0;ui.restore=v;ui.err='';}catch(e){ui.err='여행 총무 백업 파일이 아니에요. 다른 파일을 골라 주세요.';}render();};
  fr.onerror=()=>{ui.err='파일을 읽지 못했어요. 다시 시도해 주세요.';render();};
  fr.readAsText(file);}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(ui.statusOpen&&!e.target.closest('.smenu')&&!(el&&el.dataset.a==='status')){ui.statusOpen=null;if(!el||el.dataset.a==='open-trip'){e.preventDefault();render();return;}}
  if(!el)return;
  const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset.v,el);}
});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(!f)return;const v=e.target.value;
  if(f==='t.name')ui.tdraft.name=v;else if(f==='t.desc')ui.tdraft.desc=v;
  else if(f==='t.start'){ui.tdraft.start=v;if(v&&(!ui.tdraft.end||D(ui.tdraft.end)<D(v))){ui.tdraft.end=v;const o=document.querySelector('[data-f="t.end"]');if(o)o.value=v;}}
  else if(f==='t.end')ui.tdraft.end=v;
  else if(f==='r.b')ui.rdraft.b=v;else if(f==='r.w')ui.rdraft.w=v;
  else if(f==='r.new'){const n=Math.min(digits(v),9999999999);e.target.value=n?won(n):'';const t=cur(),o=document.getElementById('roundTot');if(o&&t)o.textContent=n?t.members.length+'명 × '+won(n)+'원 = 총 '+won(n*t.members.length)+'원':'';}
  else if(f==='e.ci'||f==='e.co'){const d=ui.draft;d[f.slice(2)]=v;if(f==='e.ci'&&v&&(!d.co||D(d.co)<=D(v))){d.co=new Date(D(v)+DAY).toISOString().slice(0,10);const o=document.querySelector('[data-f="e.co"]');if(o)o.value=d.co;}const nh=document.getElementById('nightHint');if(nh)nh.textContent=nightText(cur());}
  else if(f.indexOf('fl.')===0){const q=f.split('.'),g=ui.draft.fl[q[1]];if(q[2]==='s')g.stops[Number(q[3])]=v;else g[q[2]]=v;}
  else if(f==='e.memo')ui.draft.memo=v;else if(f==='e.date')ui.draft.date=v;
  else if(f==='e.amt'){const t=cur(),d=ui.draft;
    if(t.kind==='abroad'&&d.cur==='F'){const dec=decOf(t.cur);let raw=v.replace(/[^0-9.]/g,'');if(!dec)raw=raw.replace(/\./g,'');const p=raw.split('.');
      const ip=p[0]?Number(p[0]):0;d.famt=Number(ip+(p.length>1&&p[1]?'.'+p[1].slice(0,2):''))||0;
      e.target.value=(p[0]?nf(ip,0):(p.length>1?'0':''))+(p.length>1?'.'+p[1].slice(0,2):'');}
    else{const n=Math.min(digits(v),9999999999);d.amt=n;e.target.value=n?won(n):'';}
    const pp=document.getElementById('perPrev');if(pp)pp.textContent=amtHint(t);const nh=document.getElementById('nightHint');if(nh)nh.textContent=nightText(t);}
  else if(f==='c.val'){const t=cur();let raw=v.replace(/[^0-9.]/g,'');const p=raw.split('.');
    const val=(p[0]?nf(Number(p[0]),0):(p.length>1?'0':''))+(p.length>1?'.'+p[1].slice(0,2):'');e.target.value=val;ui.calc.val=val;
    const o=document.getElementById('calcOut');if(o)o.textContent=calcOut(t);}
  if(ui.err&&(f.indexOf('e.')===0||f.indexOf('r.')===0)){ui.err='';const er=document.querySelector('.err');if(er)er.remove();}
});
document.addEventListener('input',e=>{if(e.target.id==='payIn'){const n=Math.min(digits(e.target.value),9999999999);e.target.value=n?won(n):'';}});
document.addEventListener('change',e=>{
  if(e.target.id==='restoreIn'){const f=e.target.files&&e.target.files[0];if(f)readRestore(f);e.target.value='';return;}
  const c=e.target.dataset&&e.target.dataset.c;if(!c)return;const t=cur();if(!t)return;const on=e.target.checked,v=e.target.dataset.v;
  if(c==='inc'){if(on)t.inc[v]=1;else delete t.inc[v];}
  else if(c==='got'){const p=v.split('|'),e=t.exps.find(x=>x.id===p[0]);if(!e)return;e.got=e.got||{};if(on)e.got[p[1]]=Math.round(krw(t,e)/t.members.length);else delete e.got[p[1]];ui.payEdit=null;}
  else if(c==='paid'){const p=v.split('|'),r=t.rounds.find(x=>x.id===p[0]);if(!r)return;if(on)r.paid[p[1]]=r.amt;else delete r.paid[p[1]];ui.payEdit=null;}
  else if(c==='ref'){if(on)t.refunded[v]=1;else delete t.refunded[v];}
  saveTrip(t);render();
});
document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter')&&e.target.getAttribute&&e.target.getAttribute('role')==='switch'){e.preventDefault();const f=A[e.target.dataset.a];if(f)f(null,e.target);return;}
  if(e.key!=='Enter')return;const id=e.target.id;
  const m={payIn:'pay-save',memNew:'mem-add-ok',catNew:'cat-add-ok',roundNew:'round-add-ok',curN:'cur-add-ok',curU:'cur-add-ok',curK:'cur-add-ok'}[id];
  if(m){e.preventDefault();A[m]();}
  else if(e.target.tagName==='INPUT'&&e.target.type!=='checkbox'){e.target.blur();}
});

/* ---------- offline ---------- */
const APP_VERSION='1.5';
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude(usercontent)?\.(ai|com)$/.test(location.hostname)){
  const hadCtrl=!!navigator.serviceWorker.controller;let reloaded=false;
  /* 새 버전이 설치되면 한 번만 새로고침해서 바로 보여줘요 */
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloaded)return;const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='SELECT'))return;reloaded=true;location.reload();});
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
  }).catch(()=>{});});
}}catch(e){}

render();
init();
})();
